---
- hosts: kvm-control
  tasks: 
    - name: Copy Source VM qcow2 file
      copy: 
        src: /var/lib/libvirt/images/template.qcow2
        dest: /var/lib/libvirt/images/{{ item.name }}.qcow2
      loop: "{{ vms }}"
    - name: Create VM
      virt: 
        name: "{{ item.name }}"
        command: define
        xml: "{{ lookup('template', 'vm_template.xml.j2') }}"
      loop: "{{ vms }}"
