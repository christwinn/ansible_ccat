---
- name:  setup hosts that have an vdb
  hosts: all
  tasks: 
    - name: check if we have a 2nd disk
      fail: 
        msg: there is no 2nd disk
      when: ansible_facts['devices']['vdb'] is not defined
    - name: create a partition
      parted: 
        device: /dev/vdb
        number: 1
        state:  present
    - name: create a logical volume group
      lvg: 
        pvs: /dev/vdb1
        vg:  vgfiles
    - name: get vg size and store in a new variable
      set_fact: 
        vgsize: "{{ ansible_facts['lvm']['vgs']['vgfiles']['size_g'] | int }}"
    - name: show the volume size
      debug:
        var: "{{ vgsize | int / 3 * 2 }}"
    - name: set to 2/3
      set_fact: 
        volsize: "{{ vgsize | int / 3 * 2 }}g"
    - name: show the volume size
      debug:
        var: "{{ volsize }}"
    - name: create big vol 
      lvol: 
        vg:   vgfiles
        lv:   bigvolume
        size: "{{ volsize }}"
    - name: create small vol
      lvol:
        vg: vgfiles
        lv: smallvolume
        size: "+100%FREE"


