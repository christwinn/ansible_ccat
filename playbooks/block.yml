---
- name:  simple blocks
  hosts: all
  tasks: 
    - name: set up http
      block:
      - name: message
        debug: 
          msg: setting up httpd
      - name: install httpd
        dnf:
          name:  httpd
          state: present
      - name: ensure running
        service:
          name:  httpd
          state: started
      #when: ansible_distribution == "RedHat" or ansible_distribution == "AlmaLinux"
      #and we should let in Rocky 
      when: ansible_os_family == "RedHat"
