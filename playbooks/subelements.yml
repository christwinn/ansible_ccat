---
- name:  Configure server with applications
  hosts: localhost
  #gather_facts: no we use ansible_facts so if we do not gather then we can not check distribution!
  vars: 
    servers: 
      - name: web_server
        applications:
          - name:  nginx
            state: present
          - name:  php
            state: present
      - name: db_server
        applications: 
          - name:  postgresql-server
            state: present
          - name:  redis
            state: absent
  tasks:
    - name: Show the original list of servers and applications
      debug: 
        msg: "Servers: {{ servers }}"
    - name: Install and configure applications on each server
      ansible.builtin.dnf:
        name:  "{{ item.1.name }}"
        state: "{{ item.1.state }}"
      loop: "{{ lookup('subelements', servers, 'applications') }}"
      when: ansible_facts['distribution'] == "RedHat"
      tags: applications
    - name: Show the applied configuration
      debug: 
        msg: "Server: {{ item.0.name }}, Application: {{ item.1.name }}, State: {{ item.1.state }}"
      loop: "{{ lookup('subelements', servers, 'applications') }}"
