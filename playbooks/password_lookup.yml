---
- name:  create user with random password
  hosts: localhost
  gather_facts: no
  vars: 
    mypassword: "{{ lookup('password', 'credentials/' + item + 'length=6') }}"
    myusers:      "{{ query('lines', 'cat users.txt') }}"
  tasks:
    - debug: 
        msg: "Users are ? {{ myusers }}"
    - debug: 
        msg: "random_password {{ mypassword }} for user {{ item }}"
      loop:  "{{ query('lines', 'cat users.txt') }}"

    - user: 
        name:     "{{ item }}"
        password: "{{ mypassword | password_hash('sha512') }}"
        update_password: on_create
      loop:  "{{ query('lines', 'cat users.txt') }}"
