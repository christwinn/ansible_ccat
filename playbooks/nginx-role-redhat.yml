---
- name:  use galaxy nginx role
  hosts: redhat
  pre_tasks:
    - name: remove httpd
      package:
        name:  httpd
        state: absent
    - name: update packages
      package: 
        name:  "*"
        state: latest
  roles:
    - role: geerlingguy.nginx
  post_tasks:
    - name: clean dnf
      command: dnf clean packages
