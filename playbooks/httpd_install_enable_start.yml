---
- name:  install and enable and start httpd service
  hosts: redhat
  tasks: 
  - name: Install Package
    ansible.builtin.dnf: 
      name:      httpd
      state:     latest

  - name: Enable and Start httpd
    ansible.builtin.service:
      name:      httpd
      state:     started
      enabled:   yes

  - name: Allow http access
    ansible.posix.firewalld:
      service:   http
      permanent: true   # as we know permanent does not apply to the running state
      immediate: true   # so immediate must be set to update the running firewall akin to firewall-cmd --reload.
      state:     enabled
      zone:      public # apply to the default zone

- name:  install and enable and start apache2 service
  hosts: ubuntu 
  tasks: 
  - name: Install Package
    ansible.builtin.apt: 
      name:      apache2
      state:     latest

  - name: Enable and Start httpd(apache2)
    service:
      name:      apache2
      state:     started
      enabled:   yes

  - name: Check UFW
    ansible.builtin.apt:
      name:      ufw
      state:     present

  - name: Allow http access
    community.general.ufw:
      rule:      allow
      port:      "80"
      proto:     tcp

  - name: Apply ufw
    ansible.builtin.command: ufw reload

- name: Set index.html
  hosts: webservers
  tasks: 
  - name: Create index.html
    ansible.builtin.copy:
      content:   "hello world"
      dest:      "/var/www/html/index.html"

