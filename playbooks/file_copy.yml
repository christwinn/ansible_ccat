---
- name:  file copy modules
  hosts: all
  tasks: 
    - name: copy file demo
      copy:
        src:  /etc/hosts
        dest: /tmp/
    - name: add some lines to /tmp/hosts
      blockinfile:
        path: /tmp/hosts
        block: | 
          192.168.4.101 host1.example.com
          192.168.4.102 host2.example.com
        state: present
    - name: verify the file checksum
      stat:
        path: /tmp/hosts
        checksum_algorithm: md5
      register: result
    - debug:
        msg: "Checksum of /tmp/hosts is {{ result.stat.checksum }}"
    - name: fetch file
      fetch: 
        src:  /tmp/hosts
        dest: /tmp/

