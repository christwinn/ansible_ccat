---
- name:  Azure
  hosts: localhost
  gather_facts: no
  become: no
  vars_files: 
    - ../../sensitive-values
    - azure-vars.yml
  tasks:
    - name: Create Azure Resource Group
      azure.azcollection.azure_rm_resourcegroup:
        name:     "{{ rg }}"
        location: "{{ location }}"

    - name: Create Virtual Network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ rg }}"
        name: "{{ vn_name }}"
        address_prefixes_cidr: "{{ vn_ip }}"

    - name: Create Subnet
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ rg }}"
        virtual_network_name: "{{ vn_name }}"
        name: "{{ subnet_name }}"
        address_prefix_cidr: "{{ subnet10 }}"

    - name: Set up Public Ip
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ rg }}"
        name: "public_ip"
        # only option is standard and this is static and default, basic is retired
        sku:  standard
        # but we still have to define it as static!
        allocation_method: static
      register: publicip

    - name: Show Public Ip
      debug:
        msg: "Assigned IP: {{ publicip['state']['ip_address'] }}"

    #To add availability_set
    #
    - name: Create Virtual Machine
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ rg }}"
        name:           "vm1"
        vm_size:        "Standard_D2als_v7"
        admin_username: "{{ azure_vm_username }}"
        admin_password: "{{ azure_vm_password }}"
        ssh_public_keys:
          - path: "{{ '/home/' + azure_vm_username + '/.ssh/authorized_keys' }}"
            key_data: "{{ azure_ssh_publickey }}"
        image:
          offer: almalinux-x86_64
          publisher: almalinux
          sku: 10-gen2
          version: latest

